<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mortgage Calculator</title>

<style>
:root {
  --bg: #0f172a;
  --text: #e5e7eb;
  --muted: #94a3b8;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, Arial;
  color: var(--text);
  background: #0b1223;
}

/* HOME */
#home {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  background:
    linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
    url("https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=1400&q=80");

  background-size: cover;
  background-position: center;
  text-align: center;
}

#home h1 {
  font-size: 52px;
  margin-top: -80px;
}

#home button {
  margin-top: 20px;
  padding: 14px 24px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  background: #22c55e;
  cursor: pointer;
  font-weight: bold;
}

/* APP */
#app {
  display: none;
  padding: 80px 180px;
  background: radial-gradient(circle at top, #1e293b, #0b1223);
  min-height: 100vh;
}

@media (max-width: 900px) {
  #app { padding: 20px; }
}

.card {
  background: rgba(17,24,39,0.85);
  border: 1px solid rgba(148,163,184,0.2);
  border-radius: 14px;
  margin-bottom: 20px;
  padding: 18px;
}

h2 {
  margin-top: 0;
  color: #cbd5e1;
}

label {
  font-size: 13px;
  color: var(--muted);
  display: block;
  margin-top: 10px;
}

/* ✅ placeholders styling */
input::placeholder {
  color: #64748b;
}

input, select {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border-radius: 10px;
  border: 1px solid #333;
  background: #0b1220;
  color: white;
}

button.calc {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  border: none;
  border-radius: 10px;
  background: #22c55e;
  font-weight: bold;
  cursor: pointer;
}

.results {
  margin-top: 10px;
  padding: 15px;
  background: rgba(2,6,23,0.6);
  border-radius: 10px;
}

.stat {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
}

.summary {
  margin-top: 10px;
  padding: 12px;
  border-radius: 10px;
  background: rgba(59,130,246,0.12);
  border: 1px solid rgba(59,130,246,0.3);
  color: #c7d2fe;
}

/* CHART */
.chart-header {
  margin-top: 10px;
  font-size: 14px;
  color: #cbd5e1;
}

.chart-desc {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 8px;
}

canvas {
  width: 100%;
  height: 220px;
  margin-top: 10px;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home">
  <h1>Mortgage Calculator</h1>
  <button onclick="startApp()">Calculate Your Mortgage!</button>
</div>

<!-- APP -->
<div id="app">

  <div class="card">
    <h2>Inputs</h2>

    <label>Home price</label>
    <input id="price" type="number" placeholder="Type home price" />

    <label>Down payment</label>
    <input id="down" type="number" placeholder="Type down payment" />

    <label>Interest rate (annual, APR)</label>
    <input id="rate" type="number" placeholder="Type interest rate" />

    <label>Loan term</label>
    <select id="years">
      <option disabled selected>Select loan term</option>
      <option value="30">30 years (360 months)</option>
      <option value="20">20 years (240 months)</option>
      <option value="15">15 years (180 months)</option>
      <option value="10">10 years (120 months)</option>
    </select>

    <label>Property tax (%/yr)</label>
    <input id="tax" type="number" placeholder="Type property tax %" />

    <label>Homeowners insurance ($/yr)</label>
    <input id="ins" type="number" placeholder="Type insurance cost" />

    <label>HOA dues ($/mo)</label>
    <input id="hoa" type="number" placeholder="Type HOA (if any)" />

    <label>PMI (%/yr)</label>
    <input id="pmi" type="number" placeholder="Type PMI %" />

    <label>Extra principal payment ($/mo)</label>
    <input id="extra" type="number" placeholder="Type extra payment" />

    <button class="calc" onclick="recalc()">Calculate</button>
  </div>

  <div class="card">
    <h2>Results</h2>

    <div class="results">
      <div class="stat"><span>Monthly principal + interest</span><span id="pi">$0</span></div>
      <div class="stat"><span>Taxes + insurance + HOA</span><span id="ti">$0</span></div>
      <div class="stat"><span>PMI (until 20% equity)</span><span id="pmi">$0</span></div>
      <div class="stat"><span>Total monthly payment</span><span id="total">$0</span></div>
    </div>

    <div class="summary" id="summary"></div>

    <!-- ✅ CHART LABELS ADDED -->
    <div class="chart-header">Monthly Payment Breakdown</div>
    <div class="chart-desc">
      This chart shows how your total monthly payment is split between loan principal, taxes, insurance, PMI, and extra payments.
    </div>

    <canvas id="chart"></canvas>
  </div>

</div>

<script>
function startApp() {
  document.getElementById("home").style.display = "none";
  document.getElementById("app").style.display = "block";
}

function piCalc(loan, rate, months) {
  let r = rate / 100 / 12;
  if (r === 0) return loan / months;
  return (loan * r) / (1 - Math.pow(1 + r, -months));
}

function draw(pi, ti, pmi, extra) {
  const c = document.getElementById("chart");
  const ctx = c.getContext("2d");

  const dpr = window.devicePixelRatio || 1;
  c.width = c.clientWidth * dpr;
  c.height = c.clientHeight * dpr;

  ctx.clearRect(0,0,c.width,c.height);

  let total = pi + ti + pmi + extra;
  let x = 80;
  let base = c.height - 40;

  let bars = [
    {v:pi, color:"#22c55e"},
    {v:ti, color:"#60a5fa"},
    {v:pmi, color:"#f97316"},
    {v:extra, color:"#a78bfa"}
  ];

  bars.forEach(b => {
    let h = (b.v/total) * (c.height - 60);
    ctx.fillStyle = b.color;
    ctx.fillRect(x, base - h, 40, h);
    x += 70;
  });
}

function recalc() {
  let price = +priceEl().value || 0;
  let down = +downEl().value || 0;
  let rate = +rateEl().value || 0;
  let years = +yearsEl().value || 30;

  let tax = +taxEl().value || 0;
  let ins = +insEl().value || 0;
  let hoa = +hoaEl().value || 0;
  let pmiRate = +pmiEl().value || 0;
  let extra = +extraEl().value || 0;

  let loan = price - down;
  let months = years * 12;

  let pi = piCalc(loan, rate, months);
  let ti = (price * tax/100)/12 + ins/12 + hoa;
  let pmi = (down/price < 0.2) ? (loan * pmiRate/100)/12 : 0;

  let total = pi + ti + pmi + extra;

  document.getElementById("pi").innerText = "$" + pi.toFixed(2);
  document.getElementById("ti").innerText = "$" + ti.toFixed(2);
  document.getElementById("pmi").innerText = "$" + pmi.toFixed(2);
  document.getElementById("total").innerText = "$" + total.toFixed(2);

  document.getElementById("summary").innerText =
    "Loan amount: $" + loan.toFixed(2);

  draw(pi, ti, pmi, extra);
}

/* helpers */
const priceEl = () => document.getElementById("price");
const downEl = () => document.getElementById("down");
const rateEl = () => document.getElementById("rate");
const yearsEl = () => document.getElementById("years");
const taxEl = () => document.getElementById("tax");
const insEl = () => document.getElementById("ins");
const hoaEl = () => document.getElementById("hoa");
const pmiEl = () => document.getElementById("pmi");
const extraEl = () => document.getElementById("extra");
</script>

</body>
</html>
